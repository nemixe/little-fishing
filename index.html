<script>
(() => {
'use strict';
/* ================= Little Fishing (v5: float rig with baited hook, smaller fish; one boat - a bear cub fishes, bucket in the boat; endless, bucket counting, many species) — a calm fishing game for ~3 year olds =================
   Per fish: tap a fish -> hook drops, fish nibbles -> timing meter: tap the meter/button while the arrow is
   in the glowing zone -> fish is reeled up -> drag it into the bucket. A tap outside the zone makes the fish
   wiggle "bye-bye" and swim away (a new one comes later). Endless play, running count, gentle milestones.
   Difficulty rises with every catch and approaches a capped floor/ceiling asymptotically. */

const cv = document.getElementById('c');
const ctx = cv.getContext('2d', {alpha: false});
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const MOT = reduceMotion ? 0.45 : 1;
const TAU = Math.PI * 2;
const DEBUG = /[?&]debug/.test(location.search);
const SHEET = (location.search.match(/[?&]sheet=(\d)/) || [])[1];

const COLORS = [
  {id:'red',    body:'#FF5A5F', dark:'#D63A48', light:'#FFA3A6', note:523.25},
  {id:'orange', body:'#FF9F1C', dark:'#DD7700', light:'#FFC978', note:587.33},
  {id:'yellow', body:'#FFD43B', dark:'#DDA200', light:'#FFEB99', note:659.25},
  {id:'green',  body:'#3DDC84', dark:'#1DAA5E', light:'#A2F2C6', note:783.99},
  {id:'blue',   body:'#3FA9F5', dark:'#1C7CD0', light:'#A6D8FF', note:880.00},
  {id:'purple', body:'#A86CFF', dark:'#7A43D8', light:'#D4B8FF', note:1046.5},
];

/* ---------- utils ---------- */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const easeIO = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);

const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
function rr(g, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w/2, h/2));
  g.beginPath(); g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}

/* ---------- settings / persistence ---------- */
const STORE = 'littleFishing.v2';
let settings = {sound: true, vib: true, skill: 0, best: 0};
try { Object.assign(settings, JSON.parse(localStorage.getItem(STORE) || '{}')); } catch (e) {}
settings.skill = Math.max(0, +settings.skill || 0);
function save() { try { localStorage.setItem(STORE, JSON.stringify(settings)); } catch (e) {} }

/* Difficulty as a smooth function of skill s (s >= 0, no hard cap).
   Every value glides toward a sensible floor/ceiling (exponential approach), so it keeps getting a little
   harder but never impossible. */
function P(s = S.skill) {
  return {
    fishCount: Math.min(6, Math.round(2 + 4 * (1 - Math.exp(-s / 12)))),  // 2 -> 6 fish
    size: 0.66 + 0.34 * Math.exp(-s / 10),                                  // 100% -> 66% of the (already smaller) base size
    speed: 14 + 44 * (1 - Math.exp(-s / 10)),                               // px/s at U=400: 14 -> 58
    zone: 0.14 + 0.24 * Math.exp(-s / 8),                                   // target zone: 38% -> 14% of bar
    period: 2.4 + 2.8 * Math.exp(-s / 9),                                   // arrow back-and-forth: 5.2s -> 2.4s
  };
}
const SKILL_PER_CATCH = 0.6, FLEE_EASE_STREAK = 3, FLEE_EASE = 1.2;

/* ---------- audio (synthesized, offline) ---------- */
let AC = null, master = null, noiseBuf = null;
function audioInit() {
  try {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = settings.sound ? 0.55 : 0;
      const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3200;
      const comp = AC.createDynamicsCompressor();
      master.connect(lp); lp.connect(comp); comp.connect(AC.destination);
      noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.6, AC.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { AC = null; }
}
function note(freq, o = {}) {
  if (!AC || !settings.sound || AC.state !== 'running') return;
  const t0 = AC.currentTime + (o.when || 0), dur = o.dur || 0.4, vol = o.vol == null ? 0.2 : o.vol;
  const osc = AC.createOscillator(), g = AC.createGain();
  osc.type = o.type || 'sine';
  osc.frequency.setValueAtTime(o.from || freq, t0);
  if (o.from) osc.frequency.exponentialRampToValueAtTime(freq, t0 + (o.glide || dur * 0.6));
  if (o.vib) { const l = AC.createOscillator(), lg = AC.createGain(); l.frequency.value = 6; lg.gain.value = o.vib; l.connect(lg); lg.connect(osc.frequency); l.start(t0); l.stop(t0 + dur + .05); }
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + (o.att || 0.02));
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g); g.connect(master); osc.start(t0); osc.stop(t0 + dur + 0.05);
}
function noise(o = {}) {
  if (!AC || !settings.sound || AC.state !== 'running') return;
  const t0 = AC.currentTime + (o.when || 0), dur = o.dur || 0.3;
  const src = AC.createBufferSource(); src.buffer = noiseBuf;
  const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = o.freq || 1200; bp.Q.value = o.q || 0.9;
  const g = AC.createGain(); g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(o.vol || 0.1, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(bp); bp.connect(g); g.connect(master); src.start(t0); src.stop(t0 + dur + 0.05);
}
/* every color has its own gentle voice (pitch + timbre) */
function colorVoice(c, vol = 0.2, when = 0) {
  const f = c.note;
  switch (c.id) {
    case 'red':    note(f, {vol, when, dur: .5}); break;
    case 'orange': note(f, {vol: vol * .8, when, dur: .45, type: 'triangle'}); break;
    case 'yellow': note(f, {vol, when, dur: .6, vib: 7}); break;
    case 'green':  note(f, {vol, when, dur: .2}); note(f * 1.25, {vol, when: when + .14, dur: .3}); break;
    case 'blue':   note(f, {vol, when, dur: .5, from: f * .7, glide: .18}); break;
    case 'purple': note(f, {vol, when, dur: .9}); note(f * 2.76, {vol: vol * .18, when, dur: .35}); break;
  }
}
const sfx = {
  bloop()   { note(520, {from: 260, glide: .12, dur: .2, vol: .12}); },
  hookDrop(){ note(330, {from: 520, glide: .35, dur: .4, vol: .07, type: 'triangle'}); noise({freq: 900, vol: .04, dur: .2, when: .3}); },
  hit()     { note(784, {vol: .16, dur: .35}); note(1175, {vol: .12, dur: .5, when: .08}); },
  flee()    { noise({freq: 1300, vol: .05, dur: .25}); note(700, {from: 480, glide: .18, dur: .22, vol: .07, when: .05});
              note(880, {from: 620, glide: .18, dur: .25, vol: .06, when: .22}); note(560, {from: 300, glide: .1, dur: .16, vol: .05, when: .6}); },
  reel()    { note(700, {from: 260, glide: .9, dur: 1, vol: .06, type: 'triangle'});
              for (let i = 0; i < 12; i++) note(2100, {vol: .012, dur: .03, when: i * .075, type: 'square'}); },
  splash()  { noise({freq: 1400, vol: .09, dur: .35}); noise({freq: 600, vol: .05, dur: .45, when: .05}); },
  pickUp()  { note(660, {from: 440, glide: .1, dur: .18, vol: .08}); },
  floatBack(){ note(392, {from: 494, glide: .3, dur: .35, vol: .05}); },
  celebrate(c) { colorVoice(c, .18); note(c.note * 1.5, {vol: .1, dur: .6, when: .18}); },
  bigCelebrate(c) { [1, 1.25, 1.5, 2].forEach((m, i) => note(c.note * m, {vol: .13, dur: .55, when: i * .13})); note(c.note * 2, {vol: .07, dur: 1.2, when: .55, vib: 4}); },
  countPop(i) { const steps = [0, 2, 4, 5, 7, 9, 11], semi = steps[i % 7] + 12 * Math.floor(i / 7), f = 261.63 * Math.pow(2, semi / 12);
                noise({freq: 2200, vol: .035, dur: .07}); note(f, {vol: .15, dur: .4}); note(f * 2, {vol: .03, dur: .25}); },
  empty()   { note(233, {type: 'triangle', vol: .1, dur: .16}); note(208, {type: 'triangle', vol: .08, dur: .2, when: .17}); note(185, {vol: .04, dur: .3, when: .34}); },
  intoBucket() { note(392, {from: 784, glide: .35, dur: .4, vol: .06}); noise({freq: 1400, vol: .08, dur: .35, when: .05}); },
  milestone5() { [784, 988, 1175, 1568].forEach((f, i) => note(f, {vol: .08, dur: .6, when: .5 + i * .12})); },
  milestone10(){ [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => note(f, {vol: .09, dur: .7, when: .5 + i * .22}));
                 note(262, {vol: .05, dur: 2.2, att: .3, when: .5}); },
};
function buzz(p) { if (settings.vib && navigator.vibrate) { try { navigator.vibrate(p); } catch (e) {} } }

/* ---------- state ---------- */
const S = {
  mode: 'start', t: 0, skill: settings.skill * 0.6,   // new session: warm up a little below last session's level
  fish: [], cur: null, count: 0, matches: 0, recent: [], caught: [], lineup: null, bucketHop: 0, hopQ: 0, hopHand: false, bucketWobble: 0, bucketTapped: false, prompt: null, parts: [],
  idleT: 0, idleMiss: 0, slowT: 0, spawnQ: [], nextId: 1, fleeStreak: 0, flees: 0,
  m: null, modeT: 0, bucketBounce: 0, bucketBoost: 1, dragMiss: 0, hoverT: 0, hover: false,
  ptr: {down: false, x: 0, y: 0, id: null, offX: 0, offY: 0},
  bob: {x: 0, y: 0, hx: 0, hy: 0, dip: 0, surf: 0, bait: 1, onWater: true}, boatBob: 0, boatTilt: 0, wave: 0, clouds: [], weeds: [], hudPulse: 0, rainbow: 0, home: null, started: false,
  perf: {frames: 0, ms: 0},
};
window.__lf = { S, P, COLORS, bucketHit: (x, y) => bucketHit(x, y), mouthOf: f => mouthOf(f), surfY: x => surfY(x), pickFishAt: (x, y) => { const f = pickFishAt(x, y); return f ? f.id : null; },
  // test-only: alpha mask of exactly how fish f is drawn right now (full-size offscreen render, independent of the 1-px hit path)
  drawnMask(id, x0, y0, w, h) { const f = S.fish.find(f => f.id === id); const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d'); g.translate(-x0, -y0); drawFish(f.c, f.x + f.dx, f.y, f.r, f.face, fishParams(f), g);
    const d = g.getImageData(0, 0, w, h).data, a = []; for (let i = 3; i < d.length; i += 4) a.push(d[i]); return a; }, get L() { return L; }, get DPR() { return DPR; }, get MODELS() { return MODELS; },
  // test-only helper (not reachable from the UI): pretend n fish were caught
  debugFill(n) { for (let i = 0; i < n; i++) { const c = pick(COLORS), model = pick(MODEL_IDS); S.caught.push({c, model}); S.recent.push(c); if (S.recent.length > 5) S.recent.shift(); S.count++; } } }; // read-only hooks for automated testing

/* ---------- layout (safe-area aware, recomputed on resize / orientation change) ---------- */
let W = 0, H = 0, U = 0, DPR = 1, L = {}, bg = null;
const safeEl = document.getElementById('safe');
function readSafe() {
  const cs = getComputedStyle(safeEl);
  return {t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0};
}
function rodPt(t, c) { const u = 1 - t; return {x: u * u * L.handX + 2 * u * t * c.x + t * t * L.tipX, y: u * u * L.handY + 2 * u * t * c.y + t * t * L.tipY}; }
/* where a reeled-up fish hangs: from the rod tip, facing the bucket, tilted head-up just enough to fit on screen and above the water */
function danglePose(f, pre) {
  const r = f.r, M = MODELS[f.model] || MODELS.classic, len = 2.45 * r;
  const avail = W - L.safe.r - 8 - L.tipX;   // tilt head-up only as much as needed so the whole fish (length and thickness) fits
  let a = 0; while (a < 1.45 && len * Math.cos(a) + r * .65 * Math.sin(a) > avail) a += .02;
  const ca = Math.cos(a);
  const vert = len * Math.sin(a) + r * .62 * ca;
  let mouthY = L.waterTop - 6 - vert;
  if (!pre) mouthY = clamp(mouthY, L.tipY + 14, L.tipY + U * .14);
  const face = -1, rot = a, mm = M.mouth, lx = -mm[0] * r, ly = mm[1] * r, c = Math.cos(rot), s = Math.sin(rot);
  return {x: L.tipX - (lx * c - ly * s), y: mouthY - (lx * s + ly * c), face, rot, mouthY};
}
/* the boat (and everything in it) bobs and tilts gently with the waves */
function boatPt(x, y) { const dx = x - L.boatCX, dy = y - L.waterTop, c = Math.cos(S.boatTilt), s = Math.sin(S.boatTilt);
  return {x: L.boatCX + dx * c - dy * s, y: L.waterTop + dx * s + dy * c + S.boatBob}; }
function withBoat(fn) { ctx.save(); ctx.translate(L.boatCX, L.waterTop + S.boatBob); ctx.rotate(S.boatTilt); ctx.translate(-L.boatCX, -L.waterTop); fn(); ctx.restore(); }
const FISH_SCALE = 0.83;
/* the water surface (same wave as the drawn water line): the float always sits on it */
function surfY(x) { return L.waterTop + Math.sin(x * .02 + S.t * 1.2 * MOT) * 4; }
/* where the float goes for a fish + where that fish swims to so its mouth meets the baited hook */
function planHook(f) {
  const mm = MODELS[f.model].mouth, maxX = W - L.safe.r - L.bobR - 6;
  let face = f.face >= 0 ? 1 : -1;
  const mx0 = f.x + face * f.r * mm[0], want = clamp(mx0, L.bobMin, maxX);
  if (Math.abs(want - mx0) > f.r * .3) face = Math.sign(want - f.x) || face;   // fish under/behind the boat turns and swims out to the bait
  f.hookFace = face;
  f.hookX = clamp(want - face * f.r * mm[0], f.r * 1.5, W - f.r * 1.5);
  f.hookY = hookYFor(f);
  f.bobX = clamp(f.hookX + face * f.r * mm[0], L.bobMin, maxX);               // float right above the mouth
}
function layout() {
  const nw = Math.round(cv.clientWidth || innerWidth), nh = Math.round(cv.clientHeight || innerHeight);
  W = nw; H = nh; U = Math.min(W, H);
  // cap pixel ratio and total pixels for steady 60fps on mid-range phones
  DPR = Math.min(2, window.devicePixelRatio || 1);
  if (W * H * DPR * DPR > 2.4e6) DPR = Math.max(1, Math.sqrt(2.4e6 / (W * H)));
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const sa = L.safe = readSafe(), land = W > H;
  const top = sa.t, bot = H - sa.b;
  L.land = land;
  L.waterTop = top + (bot - top) * (land ? 0.34 : 0.31);
  L.sandY = bot - U * .05;
  L.fishR = clamp(Math.min(U * 0.16, (bot - L.waterTop) * 0.21), 38, 115) * FISH_SCALE;   // v5: fish drawn ~17% smaller
  L.speedK = clamp(U / 400, 0.8, 2.2);

  L.backR = clamp(U * 0.11, 44, 64); L.backX = W / 2; L.backY = bot - clamp(U * .03, 10, 20) - L.backR;

  L.boatH = L.bw * 0.42;
  L.gunY = wt - L.boatH * 0.45; L.deckY = wt - L.boatH * 0.15; L.hullBot = wt + L.boatH * 0.5;
  L.fw = L.bw * 0.74; L.fh = L.bh * 1.32; L.fR = L.fh * 0.245;
  L.x0 = sa.l + (land ? Math.max(W * 0.08, 60) : 10) + L.boatH * 0.25;     // stern
  // v5 layout: bucket at the back of the boat (left), the bear sits in front of it (right, toward the water) holding the rod
  L.bx = L.x0 + L.bw * 0.5 + L.boatH * 0.15;                               // bucket at the stern
  L.fx = L.bx + L.bw * 0.5 + L.fR * 1.15 + 4;                               // bear right next to it, nearer the bow
  L.x1 = L.fx + L.fR * 1.75;                                                // bow, just past the bear's paws
  L.boatCX = (L.x0 + L.x1) / 2;
  L.bBot = L.deckY; L.bTop = L.bBot - L.bh;
  L.bobR = Math.max(10, U * .027); L.baitLen = clamp(U * .075, 26, 48); L.hookS = Math.max(5.5, U * .019);
  L.handX = L.fx + L.fR * 1.3; L.handY = L.deckY - L.fh * 0.38;
  L.tipX = L.x1 + L.boatH * 0.45 + clamp(U * .06, 14, 40);                // rod reaches out past the bow, over the water
  L.bobMin = L.x1 + L.boatH * 0.45 + L.bobR + 10;                           // the float never goes under/into the boat
  L.restBobX = Math.max(L.tipX + U * .05, L.bobMin + 4);
  L.tipY = Math.max(top + 16, danglePose({r: L.fishR, model: 'classic'}, true).mouthY - clamp(U * .07, 22, 44));
  // rod arc: the gentlest arc that clears the bucket handle (in very short landscape skies it passes behind the handle)
  const handleTop = x => { const d = (x - L.bx) / (L.bw * .5); return Math.abs(d) >= 1 ? 1e9 : L.bTop - L.bh * .55 * Math.sqrt(1 - d * d); };
  let rc = null;
  for (let cy = Math.min(L.handY, L.tipY) - 10; cy >= top - 90; cy -= 6) {

    for (let t = .05; t < 1; t += .05) { const q = rodPt(t, c); if (q.y > handleTop(q.x) - 6) { ok = false; break; } }
    if (ok) { rc = c; break; }
  }
  L.rodC = rc || {x: L.handX + (L.tipX - L.handX) * 0.4, y: top};
  // color-request bubble: first free spot in the sky (never over the home button, fisher, bucket, rod or line)
  L.pW = clamp(U * 0.3, 100, 200); L.pH = L.pW * 0.66;

    ctx.fillStyle = '#FFD43B'; ctx.beginPath(); ctx.moveTo(x, ay + R * .2); ctx.lineTo(x - R * .2, ay - R * .02); ctx.lineTo(x + R * .2, ay - R * .02); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}
function drawPrompt() {
  const p = S.prompt; if (!p) return;
  const a = easeBack(clamp(p.t / .5, 0, 1)), x = L.pX, y = L.pY + Math.sin(S.t * 1.5) * 3 * MOT, w = L.pW, h = L.pH;
  ctx.save(); ctx.translate(x, y); ctx.scale(a, a);
  ctx.fillStyle = 'rgba(0,60,120,.12)'; rr(ctx, -w / 2, -h / 2 + 4, w, h, h * .45); ctx.fill();
  ctx.fillStyle = '#FFFFFF'; rr(ctx, -w / 2, -h / 2, w, h, h * .45); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-w * .12, h / 2 - 2); ctx.lineTo(-w * .22, h / 2 + h * .22); ctx.lineTo(w * .02, h / 2 - 2); ctx.fill();
  const pulse = .5 + .5 * Math.sin(S.t * 2.2);
  ctx.globalAlpha = .35 + .25 * pulse * MOT; ctx.fillStyle = p.c.light; ctx.beginPath(); ctx.ellipse(0, 0, w * .4, h * .4, 0, 0, TAU); ctx.fill(); ctx.globalAlpha = 1;
  drawFish(p.c, w * .06, 0, h * .28, 1, {tail: S.t * 4, model: p.model});
  ctx.restore();
}
function drawMeter() {
  const m = S.m; if (!m || m.show <= 0) return;
  const off = (1 - easeOut(m.show)) * (L.mPH + 40);
  ctx.save(); ctx.translate(0, off);
  ctx.fillStyle = 'rgba(0,40,90,.14)'; rr(ctx, L.mPX, L.mPY + 5, L.mPW, L.mPH, L.mPH * .3); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.95)'; rr(ctx, L.mPX, L.mPY, L.mPW, L.mPH, L.mPH * .3); ctx.fill();
  const bx = L.mBarX, by = L.mBarY, bw = L.mBarW, bh = L.mBarH;
  ctx.fillStyle = '#DDF3FF'; rr(ctx, bx, by, bw, bh, bh / 2); ctx.fill();
  ctx.strokeStyle = '#9BD3F2'; ctx.lineWidth = 3; ctx.stroke();
  // target zone with a soft breathing glow (layered halos, no blur filters)
  const zx = bx + (m.zc - m.zw / 2) * bw, zw = m.zw * bw, pulse = .5 + .5 * Math.sin(S.t * TAU / 1.8) * MOT;
  for (let i = 2; i >= 1; i--) {
    const e = i * (4 + 3 * pulse) + m.flash * 8;
    ctx.fillStyle = `rgba(80,240,160,${(.16 + .1 * pulse) / i + m.flash * .2})`;
    rr(ctx, zx - e, by + 3 - e, zw + e * 2, bh - 6 + e * 2, (bh - 6) / 2 + e); ctx.fill();
  }
  ctx.fillStyle = '#4BE095'; rr(ctx, zx, by + 3, zw, bh - 6, (bh - 6) / 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.35)'; rr(ctx, zx + 4, by + 6, zw - 8, (bh - 12) * .4, (bh - 12) * .2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = 3; rr(ctx, zx, by + 3, zw, bh - 6, (bh - 6) / 2); ctx.stroke();
  drawFish(m.c || COLORS[0], zx + zw / 2, by + bh / 2, Math.min(zw * .2, bh * .27), 1, {tail: S.t * 6, model: m.model});
  // arrow (pulses gently)
  const u = m.closing && m.missU != null ? m.missU : m.u;
  const nx = bx + u * bw, ps = 1 + .09 * Math.sin(S.t * TAU / 1.2) * MOT + m.flash * .15;
  ctx.save(); ctx.translate(nx, by); ctx.scale(ps, ps);
  ctx.fillStyle = '#FF4F8B'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.lineJoin = 'round';
  rr(ctx, -4, -4, 8, bh + 8, 4); ctx.fill(); ctx.stroke();
  const aw = bh * .42, ah = L.mArrowH * .95;
  ctx.beginPath(); ctx.moveTo(-aw, -ah); ctx.lineTo(aw, -ah); ctx.lineTo(0, -2); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();
  // big thumb button; brightens smoothly while the arrow is in the zone
  const gb = m.glowBtn, bR = L.mBtnR * (1 + .05 * gb + .035 * Math.sin(S.t * TAU / 1.4) * MOT);
  ctx.fillStyle = `rgba(255,200,60,${.18 + .35 * gb})`; ctx.beginPath(); ctx.arc(L.mBtnX, L.mBtnY, bR + 6 + 6 * gb, 0, TAU); ctx.fill();
  ctx.fillStyle = gb > .5 ? '#FFB81F' : '#FF9F1C'; ctx.beginPath(); ctx.arc(L.mBtnX, L.mBtnY, bR, 0, TAU); ctx.fill();
  ctx.fillStyle = `rgba(255,255,255,${.18 + .2 * gb})`; ctx.beginPath(); ctx.ellipse(L.mBtnX - bR * .2, L.mBtnY - bR * .35, bR * .55, bR * .3, -.3, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(L.mBtnX, L.mBtnY, bR, 0, TAU); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#fff'; ctx.lineWidth = bR * .06;
  ctx.beginPath(); ctx.moveTo(L.mBtnX, L.mBtnY - bR * .55); ctx.lineTo(L.mBtnX + bR * .45, L.mBtnY - bR * .05); ctx.lineTo(L.mBtnX + bR * .18, L.mBtnY - bR * .05);
  ctx.lineTo(L.mBtnX + bR * .18, L.mBtnY + bR * .5); ctx.lineTo(L.mBtnX - bR * .18, L.mBtnY + bR * .5); ctx.lineTo(L.mBtnX - bR * .18, L.mBtnY - bR * .05);
  ctx.lineTo(L.mBtnX - bR * .45, L.mBtnY - bR * .05); ctx.closePath(); ctx.fill(); ctx.stroke();
  // after a couple of fish swam away: a demo hand presses exactly when the arrow is in the zone
  if (m.demo && m.lock <= 0 && !m.closing) hand(L.mBtnX + L.mBtnR * .35, L.mBtnY + L.mBtnR * .1, clamp(U / 700, .6, 1.1), gb, .85);
  ctx.restore();
}
function drawParts() {
  for (const p of S.parts) {
    const a = 1 - p.life / p.max;
    if (p.type === 'star') star(p.x, p.y, p.size * (0.6 + .4 * a), p.color, p.rot, Math.min(1, a * 1.6));
    else if (p.type === 'bubble') { ctx.strokeStyle = `rgba(255,255,255,${.7 * a})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.stroke(); }
    else if (p.type === 'drop') { ctx.fillStyle = `rgba(160,225,255,${a})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill(); }
    else if (p.type === 'ripple') { ctx.strokeStyle = `rgba(255,255,255,${.6 * a})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(p.x, p.y, p.size * 1.6, p.size * .6, 0, 0, TAU); ctx.stroke(); }
  }
}
function drawHints() {
  const k = clamp(U / 700, .6, 1.1);
  if (S.mode === 'idle' && S.idleT > 6) {
    const sw = swimmers().filter(f => f.x > f.r && f.x < W - f.r);
    const f = (S.prompt && sw.find(o => o.c.id === S.prompt.c.id)) || sw.sort((a, b) => Math.abs(a.x - W / 2) - Math.abs(b.x - W / 2))[0];
    if (f) { const ph = (S.idleT * 1.2) % 1, press = ph < .3 ? Math.sin(ph / .3 * Math.PI) : 0; hand(f.x + f.r * .15, f.y + f.r * .1, k, press, .85); }
  }
  if (S.mode === 'dangle' && (S.modeT > (S.count === 0 ? 1.2 : 4) || S.dragMiss > 0)) {
    const f = S.cur, cyc = (S.modeT * .55) % 1, t = easeIO(clamp((cyc - .15) / .6, 0, 1));
    const hx = lerp(f.x, L.bx, t), hy = lerp(f.y, L.bTop - L.bh * .1, t) - Math.sin(t * Math.PI) * U * .05;
    ctx.setLineDash([8, 10]); ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.quadraticCurveTo((f.x + L.bx) / 2, Math.min(f.y, L.bTop) - U * .08, L.bx, L.bTop - L.bh * .1); ctx.stroke(); ctx.setLineDash([]);
    hand(hx + 6, hy + 6, k, cyc < .15 || cyc > .75 ? 0 : .6, .8 * Math.min(1, Math.sin(cyc * Math.PI) * 2));
  }
}
function startBtnR() { return clamp(U * .15, 58, 100); }
function startBtnY() { return L.safe.t + (H - L.safe.t - L.safe.b) * (L.land ? .6 : .6); }
function drawTitle() {
  ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fillRect(0, 0, W, H);
  const fs = clamp(Math.min(U * .11, W * .1), 30, 84), top = L.safe.t, ah = H - L.safe.t - L.safe.b;
  ctx.font = `800 ${fs}px "Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = fs * .16; ctx.strokeStyle = '#fff'; ctx.lineJoin = 'round';
  // portrait: title just below the boat; landscape: up in the sky, to the right of the rod tip
  const tw = ctx.measureText('Little Fishing').width;
  const tx = L.land ? clamp(Math.max(W / 2, L.tipX + 24 + tw / 2), 0, W - L.safe.r - 10 - tw / 2) : W / 2;
  const ty = (L.land ? top + (L.waterTop - top) * .45 : L.waterTop + (startBtnY() - startBtnR() - L.waterTop) * .22) + Math.sin(S.t * 1.2) * 4 * MOT;
  ctx.strokeText('Little Fishing', tx, ty); ctx.fillStyle = '#1C7CD0'; ctx.fillText('Little Fishing', tx, ty);
  const by = startBtnY(), r0 = startBtnR(), gapTop = ty + fs * .55, gapBot = by - r0 - 6;
  const fr = clamp(Math.min(U * .14, (gapBot - gapTop) * .5 / 0.75), 24, 120);
  drawFish(COLORS[1], W / 2, (gapTop + gapBot) / 2 + Math.sin(S.t * 1.5) * 3 * MOT, fr, 1, {tail: S.t * 4});
  const r = r0 * (1 + .04 * Math.sin(S.t * TAU / 1.6) * MOT);
  ctx.fillStyle = 'rgba(0,90,40,.18)'; ctx.beginPath(); ctx.arc(W / 2, by + 6, r, 0, TAU); ctx.fill();
  ctx.fillStyle = '#3DDC84'; ctx.beginPath(); ctx.arc(W / 2, by, r, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(W / 2, by, r, 0, TAU); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(W / 2 - r * .3, by - r * .42); ctx.lineTo(W / 2 + r * .45, by); ctx.lineTo(W / 2 - r * .3, by + r * .42); ctx.closePath(); ctx.fill();
  if (!L.land || H > 420) {
    ctx.font = `600 ${clamp(U * .032, 11, 17)}px system-ui,sans-serif`; ctx.fillStyle = 'rgba(20,60,100,.75)';
    ctx.fillText('Tap a fish • tap when the arrow is in the green • drag it to the bucket', W / 2, by + r + clamp(U * .06, 18, 40), W * .94);
  }
}
function drawFishLayer(states) {
  for (const f of S.fish) if (states.includes(f.state)) {
    let glow = 0;
    if (S.prompt && f.state === 'swim' && f.c.id === S.prompt.c.id && S.mode === 'idle' && S.idleT > 4) glow = .5 + .5 * Math.sin(S.t * 2.5);
    drawFish(f.c, f.x + f.dx, f.y, f.r, f.face, {tail: f.tail, rot: f.rot, scale: f.scale, glow, model: f.model});
  }
}
function drawSheet() {
  ctx.fillStyle = 'rgba(240,250,255,.9)'; ctx.fillRect(0, 0, W, H);
  const ids = MODEL_IDS, sa = L.safe;
  if (SHEET === '1') {
    const cols = W > H ? 5 : 2, rows = Math.ceil(ids.length / cols), cw = (W - sa.l - sa.r) / cols, ch = (H - sa.t - sa.b) / rows, r = Math.min(cw / 3.2, ch / 2.7);
    ids.forEach((id, i) => { const x = sa.l + (i % cols + .5) * cw + r * .18, y = sa.t + (Math.floor(i / cols) + .5) * ch;
      drawFish(COLORS[i % COLORS.length], x, y, r, 1, {model: id, tail: S.t * 4 + i}); });
  } else {
    const cols = COLORS.length, rows = ids.length, cw = (W - sa.l - sa.r) / cols, ch = (H - sa.t - sa.b) / rows, r = Math.min(cw / 3.2, ch / 2.7);
    ids.forEach((id, j) => COLORS.forEach((c, i) => drawFish(c, sa.l + (i + .5) * cw + r * .18, sa.t + (j + .5) * ch, r, 1, {model: id, tail: S.t * 4 + i + j})));
  }
}
function drawDebug() {
  const p = P();
  ctx.font = '12px monospace'; ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillStyle = 'rgba(0,0,0,.55)';
  ctx.fillRect(L.safe.l + 4, H - L.safe.b - 22, 330, 18); ctx.fillStyle = '#fff';
  ctx.fillText(`skill ${S.skill.toFixed(1)} zone ${(p.zone * 100).toFixed(0)}% arrow ${p.period.toFixed(1)}s fish ${p.fishCount} size ${(p.size * 100).toFixed(0)}%`, L.safe.l + 8, H - L.safe.b - 19);
}
function draw() {
  drawScene();
  drawFishLayer(['swim', 'hooked', 'flee']);
  drawLine();
  drawBoatGroup();
  drawFishLayer(['reel', 'dangle', 'drag', 'back']);
  if (S.mode !== 'start') { drawHome(); if (S.mode === 'idle' || S.mode === 'hook' || S.mode === 'meter') drawPrompt(); }
  drawParts();
  drawMeter();
  if (S.mode === 'count') { drawCount(); drawParts(); } else drawHints();
  if (S.mode === 'start') drawTitle();
  if (DEBUG) drawDebug();
  if (SHEET) drawSheet();
}

/* ---------- loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now;
  const t0 = performance.now();
  update(dt); draw();
  S.perf.frames++; S.perf.ms += performance.now() - t0;
  requestAnimationFrame(frame);
}

/* home-screen icon + manifest are real files in the web build (apple-touch-icon.png, manifest.webmanifest) */

layout();
for (let i = 0; i < 3; i++) spawnFish({inside: true});   // fish swim behind the title screen
if (SHEET) setTimeout(() => { S.fish = []; ctlEl.style.display = 'none'; S.mode = 'sheet'; }, 0);
setMode('start');
requestAnimationFrame(frame);

/* offline support: cache the app after first open (relative path, works under a project subpath) */
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
})();
</script>
