# Generates the PNG app icons from tools/make_icons.js and commits them, so the repo
# can be published through text-only APIs. Runs when the icon script changes (or by hand).
name: build icons
on:
  push:
    branches: [main]
    paths: ['tools/**', '.github/workflows/build-icons.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render icons
        run: |
          npm install --no-save --no-package-lock puppeteer-core@23
          CHROME="$(command -v google-chrome || command -v google-chrome-stable)" node tools/make_icons.js
          pip install --quiet pillow
          python3 tools/flatten_png.py
          rm -rf node_modules
      - name: Commit icons
        run: |
          git add -- '*.png'
          if git diff --cached --quiet; then echo "icons unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build PNG app icons"
          git push
